name: "shiftgrid"
description: |
  More than just an agent harness for pentesting, yet lightweight and transparent. An open-source prompt engine for agentic pentesting with human oversight. You point your agent (or agents) at shiftGrid's API and from there it knows the scope, follows the prompts and works through the checklists. Test observations, notes.md and a findings list help keep track of all actions and provide transparency and traceability. At any point, you can switch agents or continue testing yourself. The shiftGrid is the extended context window. (This text is typed by actual fingers) The tool is independent of the workflows, checklists, agents, and models you use. As a result, a simple workflow using a low-cost model can produce dramatically different output from a more detailed workflow using premium models running concurrently. The default workflow and checklist are intentionally kept minimal. Primary language: python; ships a container definition.
